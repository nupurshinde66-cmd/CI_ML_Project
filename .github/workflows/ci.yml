
name: ML CI Pipeline

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Build Check
        run: python -m compileall ml_model.py

      - name: Run ML Model
        run: python -c "from ml_model import train_model; print(train_model()[1])"

      - name: Run Automated Tests
        run: pytest -v
